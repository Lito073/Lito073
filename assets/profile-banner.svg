<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">Lokale websites die duidelijkheid, vertrouwen en vindbaarheid combineren</title>
  <desc id="desc">Rustige donkergrijze banner met groene accenten voor Lito's GitHub-profiel.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.58" stop-color="#111827"/>
      <stop offset="1" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#34d399" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="260" rx="18" fill="url(#bg)"/>
  <circle cx="1055" cy="50" r="130" fill="#10b981" opacity="0.08"/>
  <circle cx="110" cy="218" r="95" fill="#22c55e" opacity="0.07"/>
  <path d="M96 74h1008" stroke="url(#line)" stroke-width="2"/>
  <path d="M96 188h1008" stroke="url(#line)" stroke-width="2" opacity="0.55"/>
  <text x="96" y="123" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="36" font-weight="700">
    Lokale websites die duidelijkheid, vertrouwen en vindbaarheid combineren
  </text>
  <text x="96" y="162" fill="#bbf7d0" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="500">
    Voor ondernemers die online beter gevonden en sneller begrepen willen worden
  </text>
</svg>
